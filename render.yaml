services:
  # 1. Python ML Service (Web Service - needs public URL for backend to reach)
  - type: web
    name: sach-kavach-ml-service
    runtime: python
    rootDir: ml_service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PORT
        value: 10000

  # 2. Node.js Backend API (Web Service, runs on port 4000)
  - type: web
    name: sach-ka-kavach
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 4000
      - key: ML_SERVICE_URL
        value: https://sach-kavach-ml-service.onrender.com
      - key: FRONTEND_URL
        value: https://sach-ka-kavach.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: GROK_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
